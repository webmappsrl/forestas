name: Fix PHP code style issues

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "**.php"

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    # Il commit delle correzioni sul branch della PR richiede la scrittura: il
    # token di Actions, per default, ha solo la lettura, e il push riceveva 403.
    #
    # `actions: write` serve a rilanciare i test (ultimo passo): un commit fatto con il
    # token di Actions non fa partire altri workflow, e la PR resterebbe senza
    # `laravel-tests` sul commit piu' recente, quindi non mergiabile se i test sono
    # obbligatori su develop.
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      # Pint gira sul runner, non piu' con `aglipanci/laravel-pint-action`: quella parte da un
      # container suo, la cui immagine non ha `mbstring`. Pint esaminava i file e poi moriva
      # stampando il risultato — «Call to undefined function mb_strimwidth()» — e il check
      # restava rosso senza che il codice avesse niente che non andasse. Succedeva con la 2.4 e
      # con la 2.6, e dal runner il container non si configura.
      #
      # Si installa il solo Pint, non le dipendenze del progetto: servirebbero le credenziali di
      # Nova, e per controllare lo stile non servono. `pint.json` della radice vale lo stesso,
      # perche' Pint lo cerca nella cartella da cui gira.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring
          coverage: none

      - name: Install Pint
        run: composer global require laravel/pint --no-interaction --no-progress

      - name: Fix PHP code style issues
        run: $(composer global config bin-dir --absolute -q)/pint

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Fix styling

      - name: Rilancia i test sul commit di formattazione
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run-tests.yml --repo "${{ github.repository }}" --ref "${{ github.head_ref }}"
