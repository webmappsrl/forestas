name: Deploy dev

# A ogni push su develop: i test, poi il deploy su dev.forestas se passano.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit
  deploy:
    needs: [tests]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      branch: develop
    secrets: inherit

  notify:
    name: Notify Slack
    needs: [tests, deploy]
    if: always() && vars.SLACK_NOTIFICATIONS_ENABLED != 'false'
    uses: ./.github/workflows/notify-slack.yml
    with:
      env_name: DEV
      tests_result: ${{ needs.tests.result }}
      deploy_result: ${{ needs.deploy.result }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
