name: PHPStan

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "**.php"
      - "phpstan.neon.dist"

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Update git submodules
        run: git submodule update --init --recursive

      - name: Configure composer before install
        run: |
          composer config "http-basic.nova.laravel.com" "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_PASSWORD }}"

      - name: Install composer dependencies
        uses: ramsey/composer-install@v2

      # Larastan avvia l'applicazione per risolvere le facade sulle classi vere
      # (JWTAuth::fromUser, per esempio). Senza un .env con chiave e segreto JWT
      # l'avvio non costruisce quei servizi, e PHPStan segnala metodi che esistono.
      - name: Prepare env
        run: |
          cp .env-deploy .env
          php artisan key:generate --quiet
          php artisan jwt:secret --force --quiet

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github
