name: Deploy

# Il deploy su un ambiente, chiamato da deploy-dev.yml e deploy-uat.yml. Si collega
# al server via SSH e fa, sull'host, quello che prima si faceva a mano:
#   git pull del branch, wm-package, build di php e horizon (sempre), scripts/deploy.sh
#   nel container PHP, ricreazione di horizon, e
#   scripts/wordpress-up.sh solo se il puntatore di wp-forestas e' cambiato.
#
# Ogni ambiente e' un environment di GitHub (Settings -> Environments) con:
#   secret   SSH_HOST, SSH_USER, SSH_KEY (chiave privata di deploy)
#   variabili APP_NAME (forestasdev, forestasuat), da cui i nomi dei container, e
#   APP_URL (https://forestas.dev.maphub.it, https://forestas.uat.maphub.it) per lo
#   smoke test

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      branch:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy su ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          BRANCH: ${{ inputs.branch }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_NAME,BRANCH
          # Il primo build con TeX Live piu' un up -d che attende fino a 11 minuti (stop_grace_period di horizon) superano il
          # command_timeout di default dell'action (10m, non verificato qui).
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/html/forestas
            WP_BEFORE=$(git rev-parse HEAD:wp-forestas)
            git pull --ff-only origin "$BRANCH"
            git submodule update --init wm-package
            WP_AFTER=$(git rev-parse HEAD:wp-forestas)
            git log --oneline -1
            # L'immagine si ricostruisce sempre, PRIMA del docker exec: il package (TeX Live, font)
            # o il Dockerfile possono cambiare le dipendenze di sistema, e il container su cui gira
            # deploy.sh e' quello che si ricrea. Con la cache di Docker, se nulla e' cambiato, la
            # build e' quasi istantanea; un confronto prima/dopo il pull invece, dopo una build
            # fallita e un deploy rilanciato, chiuderebbe verde con l'immagine vecchia. I file
            # compose sono quelli con cui gira lo shard (label del container), come in
            # wordpress-up.sh: se non si leggono il deploy si ferma, senza ripiegare su compose.yml.
            # Se la build fallisce set -e ferma il deploy (oc:8982).
            SHARD="php-$APP_NAME"
            source scripts/compose-args.sh
            echo "File compose dello shard: ${FILES}"
            docker compose "${ARGS[@]}" build php horizon
            # Prima php: deploy.sh gira nel suo container, con vendor e migrazioni. Horizon si
            # ricrea dopo, cosi' non riparte con vendor vecchio e database non migrato. Il
            # `horizon:terminate` di deploy.sh agisce sul vecchio Horizon (che il supervisore del
            # container riavvia) e non confligge: la ricreazione successiva lo sostituisce con
            # l'immagine nuova.
            docker compose "${ARGS[@]}" up -d php
            docker exec "php-$APP_NAME" bash scripts/deploy.sh
            docker compose "${ARGS[@]}" up -d horizon
            if [ "$WP_BEFORE" != "$WP_AFTER" ]; then
              echo "Puntatore di wp-forestas cambiato: aggiorno WordPress"
              git submodule update --init wp-forestas
              bash scripts/wordpress-up.sh
            fi

      # Smoke test: dopo il deploy il sito risponde. Un deploy riuscito su un sito che
      # non risponde conta come fallito, e Slack lo dice.
      - name: Wait for app to be ready
        run: sleep 15
      - name: Health check /up
        run: curl --fail --max-time 30 --retry 3 --retry-delay 5 "${{ vars.APP_URL }}/up"
      - name: Check /docs/api/sus
        run: curl --fail --max-time 30 --retry 3 --retry-delay 5 -o /dev/null "${{ vars.APP_URL }}/docs/api/sus"
